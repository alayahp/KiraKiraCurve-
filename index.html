<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Style Inspo - KiraKiraCurve</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
  <style>
    /* Center the body content */
    body {
      margin: 0;
      background: linear-gradient(to right, #FFC7E0, #B3C8FF, #FFFD79); /* Gradient: Pink, Blue, Yellow */
      font-family: 'Bubblegum Sans', sans-serif;
      color: #9176FF;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh; /* Full screen height */
    }

    header {
      padding: 30px 20px 10px;
      text-align: center;
    }

    header h1 {
      font-size: 3em;
      margin: 0;
    }

    header p {
      font-size: 1.5em;
      margin: 10px 0 30px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1.2em;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .content {
      text-align: center;
      max-width: 1000px;
      margin-top: 20px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
    }

    .circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: 0.3s ease;
    }

    .circle:hover {
      box-shadow: 0 0 15px 5px #9176FF;
      transform: scale(1.05);
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-row {
      display: flex;
      justify-content: center;
      gap: 50px;
    }

    .tagline {
      font-size: 1.5em;
      margin: 40px 20px 60px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

<header>
  <h1>KiraKiraCurve</h1>
  <p>fashion for every body</p>
</header>

<nav id="navbar">
  <a href="index.html">home</a>
  <a href="about.html">about</a>
  <a href="products.html">shop looks</a>
  <a href="contact.html">contact us</a>
  <a href="gallery.html">style inspo</a>
</nav>

<main class="content">
  <h2>Style Inspo</h2>
  <p>Get inspired by our favorite gyaru looks! These styles show off confidence, cuteness, and plenty of sparkle. ✨</p>

  <div class="gallery">
    <div class="circle">
      <img src="https://i.pinimg.com/736x/ff/01/30/ff0130ed6fea4b5d5830473a80cbc0b5.jpg" alt="Gyaru Style 1">
    </div>
    <div class="bottom-row">
      <div class="circle">
        <img src="https://www.thespoiledqueen.com/wp-content/uploads/2013/12/styletravelling62.jpg" alt="Gyaru Style 2">
      </div>
      <div class="circle">
        <img src="https://acdcrag.com/cdn/shop/products/1_919e123c-079b-45a3-b4e0-fe22491ce4f6_800x.jpg?v=1652676108" alt="Decora Fashion">
      </div>
    </div>
  </div>
</main>

</body>
</html>
