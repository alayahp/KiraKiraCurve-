<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KiraKiraCurve</title>
  <style>
    body {
      margin: 0;
      background-color: #FFC7E0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #9176FF;
    }

    header {
      padding: 30px 20px 10px;
    }

    header h1 {
      font-size: 3em;
      margin: 0;
    }

    header p {
      font-size: 1.5em;
      margin: 10px 0 30px;
    }

    nav {
      margin-bottom: 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1.2em;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
    }

    .circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: 0.3s ease;
    }

    .circle:hover {
      box-shadow: 0 0 15px 5px #9176FF;
      transform: scale(1.05);
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-row {
      display: flex;
      justify-content: center;
      gap: 50px;
    }

    .tagline {
      font-size: 1.5em;
      margin: 40px 20px 60px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

<header>
  <h1>KiraKiraCurve</h1>
  <p>fashion for every body</p>
</header>

<nav>
  <a href="#">home</a>
  <a href="#">about</a>
  <a href="#">products</a>
  <a href="#">contact</a>
</nav>

<div class="gallery">
  <div class="circle">
    <img src="https://i.pinimg.com/736x/ff/01/30/ff0130ed6fea4b5d5830473a80cbc0b5.jpg" alt="Gyaru Style 1">
  </div>
  <div class="bottom-row">
    <div class="circle">
      <img src="https://www.thespoiledqueen.com/wp-content/uploads/2013/12/styletravelling62.jpg" alt="Gyaru Style 2">
    </div>
    <div class="circle">
      <img src="https://i.pinimg.com/474x/f9/41/16/f941161f73008356e18f663bb918f043.jpg" alt="Gyaru Style 3">
    </div>
  </div>
</div>

<div class="tagline">
  Express yourself with bold and trendy gyaru fashion! Our collection is designed for confidence and fun. 🌟
</div>

</body>
</html>
